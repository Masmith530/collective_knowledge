name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Token/breakpoint guard (scripts/check-tokens.mjs) + astro check.
      - name: Lint and typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
